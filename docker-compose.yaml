services:
  # PostgreSQL Database
  db:
    image: 'postgres:16-alpine'
    container_name: events_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_events_data:/var/lib/postgresql/data/
    networks:
      - events_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h 127.0.0.1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Redis (Queue + Rate Limiting)
  redis:
    image: redis:7-alpine
    container_name: events_redis
    ports:
      - "6379:6379"
    networks:
      - events_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: redis-server --appendonly yes
    volumes:
      - redis_events_data:/data

  # FastAPI Web Application
  web:
    restart: always
    build: .
    container_name: events_api
    command: [ "/bin/bash", "/commands/run_web_server.sh" ]
    env_file:
      - .env
    environment:
      - LOG_LEVEL=info
      - PYTHONPATH=/usr/src/
      - WATCHFILES_FORCE_POLLING=true
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/usr/src/app
      - ./data:/usr/src/data
      - ./commands:/commands
      - ./services:/services
    networks:
      - events_network

  # Workers
  worker:
    container_name: events_worker
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "sh", "/commands/start_worker.sh" ]
    volumes:
      - ./app:/usr/src/app
      - ./data:/usr/src/data
      - ./commands:/commands
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - PYTHONPATH=/usr/src
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis
    networks:
      - events_network
    restart: unless-stopped

  archive_worker:
    container_name: events_archive_worker
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "sh", "/commands/start_archive_worker.sh" ]
    volumes:
      - ./app:/usr/src/app
      - ./data:/usr/src/data
      - ./commands:/commands
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - PYTHONPATH=/usr/src
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis
    networks:
      - events_network
    restart: unless-stopped

  # Alembic Migrator
  migrator:
    build: .
    container_name: events_migrator
    command: [ "/bin/bash", "/commands/run_migration.sh" ]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/usr/src/app
    env_file:
      - .env
    environment:
      - PYTHONPATH=/usr/src
    networks:
      - events_network

  # Import data from CSV
  importer:
    build: .
    container_name: events_importer
    command: [ "python", "/commands/import_events.py", "/usr/src/data/events_sample.csv" ]
    depends_on:
      migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes:
      - ./app:/usr/src/app
      - ./data:/usr/src/data
      - ./commands:/commands
    env_file:
      - .env
    environment:
      - PYTHONPATH=/usr/src/app
    networks:
      - events_network


volumes:
  postgres_events_data:
    driver: local
  redis_events_data:
    driver: local

networks:
  events_network:
    driver: bridge